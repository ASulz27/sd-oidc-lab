name: oidc-check
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  id-token: write
  contents: read

jobs:
    whoami:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ vars.AWS_ROLE_ARN }}
            aws-region: us-east-1
        - run: aws sts get-caller-identity

